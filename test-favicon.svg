<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Monitor screen -->
  <rect x="12" y="16" width="40" height="24" rx="2" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <rect x="14" y="18" width="36" height="20" fill="#111827"/>
  
  <!-- Screen content - activity indicator -->
  <circle cx="20" cy="24" r="1.5" fill="#10b981"/>
  <circle cx="24" cy="24" r="1.5" fill="#f59e0b"/>
  <circle cx="28" cy="24" r="1.5" fill="#ef4444"/>
  
  <!-- Code lines on screen -->
  <rect x="18" y="28" width="16" height="1" fill="#60a5fa" opacity="0.7"/>
  <rect x="18" y="30" width="22" height="1" fill="#60a5fa" opacity="0.5"/>
  <rect x="18" y="32" width="12" height="1" fill="#60a5fa" opacity="0.7"/>
  <rect x="18" y="34" width="18" height="1" fill="#60a5fa" opacity="0.6"/>
  
  <!-- Monitor stand -->
  <rect x="28" y="40" width="8" height="3" fill="#6b7280"/>
  <rect x="20" y="43" width="24" height="2" fill="#6b7280"/>
  
  <!-- Connection indicator -->
  <circle cx="48" cy="20" r="3" fill="#10b981" opacity="0.8"/>
  <circle cx="48" cy="20" r="2" fill="#34d399">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- MCP indicator text -->
  <text x="32" y="54" text-anchor="middle" font-family="monospace" font-size="6" fill="#60a5fa" font-weight="bold">MCP</text>
</svg> 